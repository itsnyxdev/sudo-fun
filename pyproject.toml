[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sudo-fun"
version = "1.0.0"
description = "A modular Linux CLI wrapper around sudo with interactive challenge gates."
authors = [{ name = "sudo-fun team" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "sounddevice>=0.4.6",
    "scipy>=1.10.0",
    "onnxruntime>=1.16.0",
    "mediapipe>=0.10.0",
    "vosk>=0.3.45",
]

[project.scripts]
sudo-fun = "sudo_fun.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
